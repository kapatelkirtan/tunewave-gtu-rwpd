name: Capture live TuneWave screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-live-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture the deployed site at desktop and mobile sizes
        run: |
          mkdir -p live-site-captures
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          const url = 'https://tunewave-gtu-rwpd-1.onrender.com/';
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const report = [];
            try {
              let verified = false;
              let desktopPage;
              for (let attempt = 1; attempt <= 18; attempt++) {
                const context = await browser.newContext({
                  viewport: { width: 1728, height: 1000 },
                  deviceScaleFactor: 1,
                  serviceWorkers: 'block'
                });
                desktopPage = await context.newPage();
                try {
                  await desktopPage.goto(url + '?capture=' + Date.now(), {
                    waitUntil: 'domcontentloaded',
                    timeout: 60000
                  });
                  await desktopPage.waitForTimeout(4000);
                  const state = await desktopPage.evaluate(() => ({
                    title: document.title,
                    css: document.querySelector('link[rel="stylesheet"]')?.getAttribute('href') || '',
                    badgePresent: !!document.querySelector('.free-pill'),
                    heroPresent: !!document.querySelector('.welcome-row'),
                    heroText: document.querySelector('.welcome-row h1')?.innerText || ''
                  }));
                  report.push({ attempt, ...state });
                  if (state.title.includes('TuneWave') && state.css.includes('20261020-7') &&
                      !state.badgePresent && state.heroPresent) {
                    verified = true;
                    break;
                  }
                } catch (e) {
                  report.push({ attempt, error: String(e) });
                }
                await desktopPage.close().catch(() => {});
                await context.close().catch(() => {});
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
              if (!verified) {
                fs.writeFileSync('live-site-captures/capture-report.json', JSON.stringify(report, null, 2));
                throw new Error('The live site did not expose the latest stylesheet and removed badge within 3 minutes; refusing to capture a stale version.');
              }
              await desktopPage.evaluate(async () => {
                await document.fonts.ready;
                await Promise.all(Array.from(document.images).map(img => img.decode().catch(() => {})));
              });
              await desktopPage.screenshot({
                path: 'live-site-captures/TuneWave_Live_Desktop.png',
                fullPage: false,
                animations: 'disabled'
              });
              const desktopMetrics = await desktopPage.evaluate(() => {
                const rect = s => {
                  const e = document.querySelector(s);
                  if (!e) return null;
                  const r = e.getBoundingClientRect();
                  return { x: Math.round(r.x), y: Math.round(r.y), width: Math.round(r.width), height: Math.round(r.height) };
                };
                return {
                  viewport: { width: innerWidth, height: innerHeight },
                  documentWidth: document.documentElement.scrollWidth,
                  badgePresent: !!document.querySelector('.free-pill'),
                  brand: rect('.mobile-brand'),
                  hero: rect('.welcome-row'),
                  heroText: rect('.welcome-row > div:first-child'),
                  heroArtwork: rect('.hero-art'),
                  install: rect('#install-button'),
                  installTip: rect('.top-install-tip'),
                  settings: rect('#settings-button')
                };
              });
              report.push({ viewport: 'desktop', metrics: desktopMetrics });
              await desktopPage.context().close();

              const mobileContext = await browser.newContext({
                viewport: { width: 430, height: 932 },
                screen: { width: 430, height: 932 },
                deviceScaleFactor: 1,
                isMobile: true,
                hasTouch: true,
                serviceWorkers: 'block'
              });
              const mobilePage = await mobileContext.newPage();
              await mobilePage.goto(url + '?capture=mobile-' + Date.now(), {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });
              await mobilePage.waitForTimeout(6000);
              await mobilePage.evaluate(async () => {
                await document.fonts.ready;
                await Promise.all(Array.from(document.images).map(img => img.decode().catch(() => {})));
              });
              const mobileState = await mobilePage.evaluate(() => ({
                title: document.title,
                css: document.querySelector('link[rel="stylesheet"]')?.getAttribute('href') || '',
                badgePresent: !!document.querySelector('.free-pill'),
                viewport: { width: innerWidth, height: innerHeight },
                documentWidth: document.documentElement.scrollWidth,
                documentHeight: document.documentElement.scrollHeight
              }));
              if (!mobileState.title.includes('TuneWave') || !mobileState.css.includes('20261020-7') || mobileState.badgePresent) {
                throw new Error('Mobile capture did not load the latest badge-free site: ' + JSON.stringify(mobileState));
              }
              await mobilePage.screenshot({
                path: 'live-site-captures/TuneWave_Live_Mobile.png',
                fullPage: false,
                animations: 'disabled'
              });
              report.push({ viewport: 'mobile', metrics: mobileState });
              fs.writeFileSync('live-site-captures/capture-report.json', JSON.stringify(report, null, 2));
              await mobileContext.close();
              console.log(JSON.stringify(report, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tunewave-live-desktop-mobile-screenshots
          path: live-site-captures/
          if-no-files-found: warn
          retention-days: 7
