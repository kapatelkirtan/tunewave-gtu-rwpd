name: Build TuneWave Android PiP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android-pip/**'
      - 'app.js'
      - '.github/workflows/build-tunewave-android-pip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TuneWave
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p android-pip assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tunewave-pip-debug-apk
          path: android-pip/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
