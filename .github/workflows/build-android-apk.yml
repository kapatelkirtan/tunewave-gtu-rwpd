name: Build TuneWave Android APK

on:
  push:
    paths:
      - "app.js"
      - "index.html"
      - "service-worker.js"
      - "android/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TuneWave
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuneWave-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tunewave-apk-${{ github.run_number }}
          name: TuneWave Android APK build ${{ github.run_number }}
          body: |
            Debug-signed TuneWave Android APK for testing and sideload installation.
            Direct audio catalogue streams use Android Media3 background playback.
            YouTube content is played via the official embed; its background playback remains controlled by YouTube.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          make_latest: true
